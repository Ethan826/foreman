<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">The proofing table</title>
  <desc id="desc">At an amber-lit printmaker's table, two hands examine an etching of reeds. A wiping cloth rests on a copper plate and the proof's approval line is blank.</desc>
  <defs>
    <radialGradient id="room" cx=".49" cy=".5" r=".66">
      <stop stop-color="#6b4a32"/><stop offset=".55" stop-color="#3e2a24"/><stop offset="1" stop-color="#22191a"/>
    </radialGradient>
    <linearGradient id="paper" x2=".83" y2="1">
      <stop stop-color="#f5dda5"/><stop offset=".37" stop-color="#ddbf89"/><stop offset="1" stop-color="#b99565"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="1" x2="1" y2=".12">
      <stop stop-color="#784235"/><stop offset=".5" stop-color="#ae6742"/><stop offset="1" stop-color="#d99b59"/>
    </linearGradient>
    <linearGradient id="skin" x2=".27" y2="1">
